<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0b0c10" />
    </radialGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="140" fill="url(#orb)" filter="url(#glow)" />
  <!-- Headphone Arc -->
  <path d="M170 250 A 86 86 0 0 1 342 250" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <!-- Left Ear Cup -->
  <rect x="150" y="240" width="30" height="56" rx="15" fill="#ffffff" />
  <!-- Right Ear Cup -->
  <rect x="332" y="240" width="30" height="56" rx="15" fill="#ffffff" />
  <!-- Audio wave core -->
  <circle cx="256" cy="270" r="16" fill="#0b0c10" />
</svg>
